name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest

    env:
      APP_ENV: testing
      DB_CONNECTION: sqlite
      DB_DATABASE: database/database.sqlite
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
      MAIL_MAILER: array
      BROADCAST_CONNECTION: log

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, intl, pdo_sqlite, sqlite3
          coverage: none

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Prepare application environment
        run: |
          cp .env.example .env
          mkdir -p database
          touch database/database.sqlite

      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Install frontend dependencies
        run: npm ci

      - name: Generate application key
        run: php artisan key:generate --force

      - name: Run Laravel Pint
        run: vendor/bin/pint --test

      - name: Build frontend assets
        run: npm run build

      - name: Run test suite
        run: php artisan test --compact

  playwright:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare environment file
        run: cp .env.example .env

      - name: Build and start containers
        run: docker compose up -d --build

      - name: Wait for services to be healthy
        run: |
          echo "Waiting for MySQL..."
          until docker compose exec -T mysql mysqladmin ping -h 127.0.0.1 --silent 2>/dev/null; do
            sleep 2
          done
          echo "MySQL is ready"

          echo "Waiting for nginx..."
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/login > /dev/null 2>&1; then
              echo "nginx is ready"
              break
            fi
            echo "waiting for nginx... ($i/30)"
            sleep 2
          done

      - name: Bootstrap application
        run: |
          docker compose exec -T -u root app composer install --no-interaction --no-progress --prefer-dist
          docker compose exec -T -u root app php artisan key:generate --force
          docker compose exec -T -u root app php artisan migrate --force
          docker compose exec -T -u root app php artisan db:seed --force
          docker compose exec -T -u root app npm ci
          docker compose exec -T -u root app npm run build
          docker compose exec -T -u root app chown -R app:app /var/www/html

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Diagnose app after bootstrap
        run: |
          curl -v http://127.0.0.1:8000/login 2>&1 | head -30
          docker compose ps
          docker compose logs --tail 20 app

      - name: Run Playwright tests
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
